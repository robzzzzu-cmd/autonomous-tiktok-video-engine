name: Autonomous TikTok Video Engine

on:
  schedule:
    # Runs automatically every day at 14:00 UTC (10:00 AM EDT / 7:00 AM PDT)
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      recipe_topic:
        description: 'Custom recipe topic (optional - leave blank to let Gemini auto-pick a viral trend)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  generate-and-publish:
    name: Generate 40s TikTok Video
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Autonomous Video Generation Engine
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "::group::Executing Video Generation Pipeline"
          python generate.py --topic "${{ github.event.inputs.recipe_topic }}"
          echo "::endgroup::"

      - name: Commit and push updated history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          if ! git diff --cached --quiet; then
            echo "Changes detected in history.json, committing..."
            git commit -m "chore: update recipe history [skip ci]"
            # Pull latest changes with rebase in case of concurrent commits
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "${{ github.ref_name }}"
          else
            echo "No changes in history.json to commit."
          fi

      - name: Upload Rendered TikTok Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-recipe-video
          path: output/recipe-*.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Render GitHub Actions Summary
        if: always()
        run: |
          echo "### 🎬 TikTok Video Generation Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "output/generation_summary.md" ]; then
            cat output/generation_summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "Video generation completed. Check job logs and artifacts." >> $GITHUB_STEP_SUMMARY
          fi
